<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELON FIELD</title>
    <style>
        /* 1. 기본 설정 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Times New Roman", Times, serif;
            font-size: 13.5px;
            color: #000;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .split-screen {
            display: flex;
            flex-direction: column; 
            width: 100%;
            min-height: 100vh;
        }

        .left-side {
            flex: 1;
            padding: 30px;
            border-bottom: 2px solid #000; 
            box-sizing: border-box;
        }

        .right-side {
            flex: 1; 
            padding: 30px;
            box-sizing: border-box;
        }

        .list-item, .exhibit-item {
            margin: 2px 0 !important; 
            line-height: 1.4;
            display: block;
        }

        .exhibit-item {
            cursor: pointer;
            color: #000;
            text-decoration: none;
        }
        .exhibit-item:hover {
            text-decoration: underline;
            color: #0000EE;
        }

        /* PDF 원본 라인 및 줄바꿈 유지 스타일 */
        .intro-text {
            max-width: 600px;      
            line-height: 1.8;      
            margin-top: 15px;
            font-size: 13.5px;
            white-space: pre-line; 
        }

        @media (min-width: 768px) {
            body, html { height: 100%; overflow: hidden; }
            .split-screen {
                flex-direction: row;
                height: 100vh;
            }
            .left-side {
                height: 100vh;
                overflow-y: auto;
                border-right: 2px solid #000;
                border-bottom: none;
                padding: 40px;
            }
            .right-side {
                height: 100vh;
                overflow-y: auto;
                padding: 40px;
            }
        }

        hr { border: 0; border-top: 2px solid #000; margin: 25px 0; }
        hr.divider { border-top: 1px solid #000; margin: 60px 0 40px 0; }
        
        a { color: #000; text-decoration: none; }
        a:hover { color: #0000EE; text-decoration: underline; }
        
        .section-title { 
            font-size: 14px; 
            font-weight: bold; 
            margin-top: 15px;
            margin-bottom: 5px; 
        }
        mark { background-color: #eee; padding: 0 2px; }

        .media-container { margin-bottom: 15px; }
        .archive-img { width: 100%; margin-bottom: 10px; display: block; }
        
        .caption { 
            font-family: "Times New Roman", Times, serif !important;
            font-size: 13px !important; 
            line-height: 1.7 !important;
            color: #333 !important; 
            margin-bottom: 40px; 
        }
    </style>
</head>
<body>

<div class="split-screen">
    <!-- 왼쪽 영역 (목록 및 약력) -->
    <div class="left-side">
        <div style="margin-bottom: 20px;">
            <!-- 💡 로고 클릭 시 goHome() 함수를 실행하여 열려 있던 상세창을 모두 닫고 초기 화면으로 되돌림 -->
            <span class="exhibit-item" onclick="goHome()" style="display: inline-block; cursor: pointer;">
                <img src="images/logo.jpg" alt="MELON FIELD" style="height: 60px; display: block;">
            </span>
            <br><br>
            <div class="list-item">인천광역시 제물포구 참외전로 13번길 2 1층</div>
            <div class="list-item">1F, 2, Chamoejeon-ro 13beon-gil, Jemulpo-gu, Korea</div>
            <div class="list-item">Email : <a href="mailto:melonfield.kr@gmail.com">melonfield.kr@gmail.com</a></div>
            <div class="list-item">Instagram : <a href="https://www.instagram.com/melonfield.kr" target="_blank">@melonfield.kr</a></div>
            <br><br>
            <!-- 💡 History 항목 -->
            <div class="list-item">History</div>
            <strong class="exhibit-item" onclick="showContent('history-detail')">
                멜론필드의 터, 그리고 수협에 대하여
            </strong>
            <!-- History 클릭 시 나타날 상세 내용 영역 -->
            <div id="history-detail" style="display: none; margin-top: 15px; margin-bottom: 25px;">
                <div class="intro-text">
                멜론필드(Melon Field)는 참외의 영어명인 '코리안 멜론(Korean Melon)'의 멜론
